<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Outer Shield -->
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C033B"/>
      <stop offset="100%" stop-color="#5A0225"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Shield Base -->
  <path d="M 60 8 Q 95 8 102 32 C 102 72 60 110 60 110 C 60 110 18 72 18 32 Q 25 8 60 8 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Inner Shield Inset -->
  <path d="M 60 14 Q 90 14 96 35 C 96 68 60 102 60 102 C 60 102 24 68 24 35 Q 30 14 60 14 Z" fill="none" stroke="rgba(254, 243, 199, 0.4)" stroke-width="1.2"/>

  <!-- Cogwheel / Gear (Technical Training & Entrepreneurship) -->
  <g transform="translate(60, 48)">
    <circle r="16" fill="#6B022D" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Gear teeth -->
    <path d="M -2 -19 H 2 V -15 H -2 Z M -2 15 H 2 V 19 H -2 Z M -19 -2 V 2 H -15 V -2 Z M 15 -2 V 2 H 19 V -2 Z M -13 -13 L -10 -10 L -12 -8 L -15 -11 Z M 10 10 L 13 13 L 11 15 L 8 12 Z M -13 13 L -10 10 L -8 12 L -11 15 Z M 10 -10 L 13 -13 L 15 -11 L 12 -8 Z" fill="url(#goldGrad)"/>
    <circle r="9" fill="#8C033B" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Center star / torch spark -->
    <circle r="4" fill="#FEF3C7"/>
  </g>

  <!-- Open Book (Academic Excellence & Knowledge) -->
  <g transform="translate(60, 78)">
    <!-- Left page -->
    <path d="M -2 -10 C -12 -12 -22 -6 -24 4 C -24 7 -22 8 -20 8 C -14 6 -6 4 0 7 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
    <!-- Right page -->
    <path d="M 2 -10 C 12 -12 22 -6 24 4 C 24 7 22 8 20 8 C 14 6 6 4 0 7 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
    <!-- Book lines -->
    <line x1="-18" y1="-1" x2="-6" y2="1" stroke="#94A3B8" stroke-width="1"/>
    <line x1="-18" y1="3" x2="-6" y2="5" stroke="#94A3B8" stroke-width="1"/>
    <line x1="6" y1="1" x2="18" y2="-1" stroke="#94A3B8" stroke-width="1"/>
    <line x1="6" y1="5" x2="18" y2="3" stroke="#94A3B8" stroke-width="1"/>
  </g>

  <!-- Gold Laurel / Ribbon Banner Accent at Top -->
  <path d="M 40 18 Q 60 14 80 18" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
